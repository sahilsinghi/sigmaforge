name: deploy-rules

# Export the rules in deployable form and, when lab SIEM credentials are configured, push them.
# Without secrets the bundles are still built and attached to the run.
#
# Called by detections.yml as its last job, only for pushes to main that passed the gate, so it
# never runs pull-request code with secrets in scope (no workflow_run trigger). Can also be run
# by hand from the Actions tab.

on:
  workflow_call:
    secrets:
      KIBANA_URL:
        required: false
      KIBANA_API_KEY:
        required: false
      ES_URL:
        required: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false  # github.sha: the commit whose gate just passed
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      - name: Build bundles
        run: |
          sigmaforge export elastic -o out/deploy/elastic-rules.ndjson
          sigmaforge export elastic-template -o out/deploy/elastic-caseless-component-template.json
          sigmaforge export splunk -o out/deploy/savedsearches.conf

      - name: Push to the lab Elastic / Kibana
        env:
          KIBANA_URL: ${{ secrets.KIBANA_URL }}
          KIBANA_API_KEY: ${{ secrets.KIBANA_API_KEY }}
          ES_URL: ${{ secrets.ES_URL }}
        run: |
          if [ -z "$KIBANA_URL" ] || [ -z "$KIBANA_API_KEY" ]; then
            echo "No KIBANA_URL / KIBANA_API_KEY secrets: skipping deployment (bundles are attached as artifacts)."
            exit 0
          fi
          if [ -n "$ES_URL" ]; then
            curl -fsS -X PUT "$ES_URL/_component_template/sigmaforge-caseless" \
              -H "Authorization: ApiKey $KIBANA_API_KEY" -H 'Content-Type: application/json' \
              --data-binary @out/deploy/elastic-caseless-component-template.json
          fi
          curl -fsS -X POST "$KIBANA_URL/api/detection_engine/rules/_import?overwrite=true" \
            -H "Authorization: ApiKey $KIBANA_API_KEY" -H 'kbn-xsrf: true' \
            -F "file=@out/deploy/elastic-rules.ndjson"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deployable-rules
          path: out/deploy/
