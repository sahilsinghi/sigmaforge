name: noise-drift

# Nightly: replay every alerting rule on the newest benign data and open an
# issue when a rule's alerts/host/day drift above its budget or well above main.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      - name: Get fresh benign data
        env:
          BENIGN_EXPORT_URL: ${{ secrets.BENIGN_EXPORT_URL }}
        run: |
          mkdir -p fresh
          if [ -n "$BENIGN_EXPORT_URL" ]; then
            # JSONL(.gz) exported from the lab VM by scripts/Export-SysmonBaseline.ps1
            curl -fsSL "$BENIGN_EXPORT_URL" -o fresh/benign.jsonl.gz
          else
            # No lab export configured: simulate a new week with a date-based seed so the
            # mechanism is exercised end to end.
            sigmaforge baseline generate --out fresh --days 7 --seed "$(date +%Y%m%d)"
          fi

      - name: Replay and compare with main's baseline
        id: drift
        run: |
          set +e
          sigmaforge drift --benign fresh --markdown drift.md
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Open or update the drift issue
        if: steps.drift.outputs.exit == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('drift.md', 'utf8');
            const { owner, repo } = context.repo;
            const title = 'Detection noise drift';
            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'detection-drift' });
            if (open.data.length) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open.data[0].number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body, labels: ['detection-drift'] });
            }
