name: detections

on:
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: detections-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # main only: commit refreshed baseline/metrics.json
      pull-requests: write   # sticky PR comment
    services:
      opensearch:
        image: opensearchproject/opensearch:2.19.1
        ports: ["9200:9200"]
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
        options: >-
          --health-cmd "curl -fs http://localhost:9200 || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Cache pinned attack telemetry
        uses: actions/cache@v4
        with:
          path: .cache/datasets
          key: datasets-${{ hashFiles('datasets/*.lock.json') }}

      - name: Fetch real attack samples (pinned commit, blob-hash verified)
        run: sigmaforge datasets fetch evtx-attack-samples

      - name: Rebuild benign baseline and check it matches the lock
        run: sigmaforge baseline verify

      - name: Unit tests
        run: pytest -q

      - name: Baseline metrics from the base branch
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git show "origin/${{ github.base_ref }}:baseline/metrics.json" > base-metrics.json 2>/dev/null \
              && echo "path=base-metrics.json" >> "$GITHUB_OUTPUT" \
              || echo "path=" >> "$GITHUB_OUTPUT"
          else
            echo "path=baseline/metrics.json" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint, convert, replay, compare backends, gate
        id: ci
        run: |
          set +e
          ARGS="--require-external --opensearch http://localhost:9200"
          if [ -n "${{ steps.base.outputs.path }}" ]; then ARGS="$ARGS --baseline ${{ steps.base.outputs.path }}"; fi
          sigmaforge ci $ARGS \
            --report-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Job summary
        if: always()
        run: cat out/pr-comment.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload report, Navigator layer and converted queries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sigmaforge-report
          path: |
            out/report.html
            out/results.json
            out/gate.json
            out/attack-navigator-layer.json
            out/queries/
            out/badges/

      - name: Sticky PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('out/pr-comment.md', 'utf8');
            const marker = '<!-- sigmaforge-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Block the merge if the gate failed
        if: steps.ci.outputs.exit != '0'
        run: |
          echo "::error::SigmaForge gate blocked this change. See the PR comment or the report artifact."
          exit 1

      - name: Refresh the committed regression baseline (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cp out/metrics.json baseline/metrics.json
          if ! git diff --quiet -- baseline/metrics.json; then
            git config user.name "sigmaforge-bot"
            git config user.email "sigmaforge-bot@users.noreply.github.com"
            git commit -m "Update baseline metrics [skip ci]" -- baseline/metrics.json
            git push
          fi

      - name: Prepare Pages site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p site
          cp out/report.html site/index.html
          cp out/results.json out/attack-navigator-layer.json site/
          cp -r out/badges site/badges
          cp -r out/queries site/queries

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
