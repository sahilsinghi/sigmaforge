name: detections

on:
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: detections-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # This job runs pull-request code (pip install -e ., pytest, the gate): read-only, except
    # for posting its own comment. The baseline push lives in a separate main-only job.
    permissions:
      contents: read
      pull-requests: write   # sticky PR comment (read-only for fork PRs; that step tolerates it)
    services:
      opensearch:
        image: opensearchproject/opensearch:2.19.1
        ports: ["9200:9200"]
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
        options: >-
          --health-cmd "curl -fs http://localhost:9200 || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Cache pinned attack telemetry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/datasets
          key: datasets-${{ hashFiles('datasets/*.lock.json') }}

      - name: Fetch real attack samples (pinned commit, blob-hash verified)
        run: sigmaforge datasets fetch evtx-attack-samples

      - name: Rebuild benign baseline and check it matches the lock
        run: sigmaforge baseline verify

      - name: Unit tests
        run: pytest -q

      - name: Baseline metrics from the base branch
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git show "origin/${BASE_REF}:baseline/metrics.json" > base-metrics.json 2>/dev/null \
              && echo "path=base-metrics.json" >> "$GITHUB_OUTPUT" \
              || echo "path=" >> "$GITHUB_OUTPUT"
          else
            echo "path=baseline/metrics.json" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint, convert, replay, compare backends, gate
        id: ci
        env:
          BASELINE: ${{ steps.base.outputs.path }}
          REPORT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          ARGS=(--require-external --opensearch http://localhost:9200)
          if [ -n "$BASELINE" ]; then ARGS+=(--baseline "$BASELINE"); fi
          sigmaforge ci "${ARGS[@]}" --report-url "$REPORT_URL"
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Job summary
        if: always()
        run: cat out/pr-comment.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload report, Navigator layer and converted queries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sigmaforge-report
          path: |
            out/report.html
            out/results.json
            out/gate.json
            out/attack-navigator-layer.json
            out/queries/
            out/badges/

      - name: Sticky PR comment
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true  # fork PRs get a read-only token; the job summary still has the report
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('out/pr-comment.md', 'utf8');
            const marker = '<!-- sigmaforge-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Block the merge if the gate failed
        if: steps.ci.outputs.exit != '0'
        run: |
          echo "::error::SigmaForge gate blocked this change. See the PR comment or the report artifact."
          exit 1

      - name: Keep the metrics for the baseline job (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: metrics
          path: out/metrics.json

      - name: Prepare Pages site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p site
          cp out/report.html site/index.html
          cp out/results.json out/attack-navigator-layer.json site/
          cp -r out/badges site/badges
          cp -r out/queries site/queries

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  baseline:
    # Only trusted code on main reaches this job, and only after the gate passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write        # commit refreshed baseline/metrics.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: metrics
          path: out
      - name: Refresh the committed regression baseline
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cp out/metrics.json baseline/metrics.json
          if ! git diff --quiet -- baseline/metrics.json; then
            git config user.name "sigmaforge-bot"
            git config user.email "sigmaforge-bot@users.noreply.github.com"
            git commit -m "Update baseline metrics [skip ci]" -- baseline/metrics.json
            git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:main
          fi

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    secrets:
      KIBANA_URL: ${{ secrets.KIBANA_URL }}
      KIBANA_API_KEY: ${{ secrets.KIBANA_API_KEY }}
      ES_URL: ${{ secrets.ES_URL }}
