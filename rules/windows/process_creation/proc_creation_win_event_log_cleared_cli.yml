title: Windows Event Log Cleared From the Command Line
id: c648556f-2ab5-4dfa-af02-da56c1ab6d36
status: test
description: |
  Detects wevtutil clearing an event log (cl / clear-log) or PowerShell's Clear-EventLog.
  Intruders clear logs to remove evidence. The Security-log variant also produces event
  1102, covered by a separate rule, but clearing other channels (Sysmon, PowerShell)
  leaves only this process trace.
references:
  - https://attack.mitre.org/techniques/T1685/005/
author: Sahil Singhi
date: 2026-10-18
tags:
  - attack.defense-impairment
  - attack.t1685.005
logsource:
  category: process_creation
  product: windows
detection:
  selection_wevtutil_img:
    - Image|endswith: '\wevtutil.exe'
    - OriginalFileName: 'wevtutil.exe'
  selection_wevtutil_cli:
    CommandLine|contains:
      - ' cl '
      - ' clear-log '
  selection_powershell:
    CommandLine|contains: 'Clear-EventLog'
  condition: all of selection_wevtutil_* or selection_powershell
falsepositives:
  - Lab rebuild scripts.
level: high
x_sigmaforge:
  owner: sahil.singhi
  confidence: high
  noise_budget: 0.01
  tests:
    positive:
      - tests/positive/proc_creation_win_event_log_cleared_cli
    negative:
      - tests/negative/proc_creation_win_event_log_cleared_cli
