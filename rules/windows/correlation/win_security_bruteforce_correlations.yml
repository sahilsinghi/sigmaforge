title: Burst of Failed Logons From One Source
id: e358c085-2e14-484f-8edd-b0e879d1bc81
name: failed_logon_burst
status: test
description: Building block - ten or more failed network logons from one IP within five minutes.
author: Sahil Singhi
date: 2026-10-18
correlation:
  type: event_count
  rules:
    - failed_network_logon
  group-by:
    - IpAddress
  timespan: 5m
  condition:
    gte: 10
level: medium
tags:
  - attack.credential-access
  - attack.t1110.001
x_sigmaforge:
  owner: sahil.singhi
  confidence: high
  tests:
    positive:
      - tests/positive/win_security_bruteforce_then_success
